name: Compilar APK Android (Asistencia Puerta MMM)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL del Servidor Backend (API)'
        required: true
        default: 'https://saprcoe.mmmvenezuela.org'
        type: string
  push:
    branches:
      - dev
      - main
      - master
    paths:
      - 'asistencia-app/**'
      - '.github/workflows/build-asistencia-apk.yml'

jobs:
  build-apk:
    name: Generar APK Asistencia Puerta (Sin EAS)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: asistencia-app

    env:
      EXPO_PUBLIC_API_URL: ${{ github.event.inputs.api_url || 'https://saprcoe.mmmvenezuela.org' }}
      NODE_ENV: production

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v7

      - name: 2. Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 3. Configurar Java JDK 17 (requerido por Android Gradle)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Aceptar licencias del Android SDK preinstalado
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: 5. Habilitar caché de Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 6. Instalar dependencias del proyecto
        run: npm install --legacy-peer-deps

      - name: 7. Generar proyecto nativo Android (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 8. Compilar APK de Producción (Gradle Release)
        working-directory: asistencia-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -x lint -x test --build-cache

      - name: 9. Renombrar APK final
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ./Asistencia-MMM-Venezuela.apk

      - name: 10. Subir APK listo para descargar
        uses: actions/upload-artifact@v7
        with:
          name: Asistencia-MMM-Venezuela-APK
          path: asistencia-app/Asistencia-MMM-Venezuela.apk
          retention-days: 30
          if-no-files-found: error

